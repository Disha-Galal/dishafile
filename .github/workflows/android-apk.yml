name: Android APK
on:
  push:
    branches: [main, 'build/**']
    paths-ignore: ['docs/**', 'README.md', 'CHANGELOG.md', 'LICENSE', 'AGENTS.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', 'CHANGELOG.md', 'LICENSE', 'AGENTS.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Bundle and test offline editor
        working-directory: editor
        run: |
          npm ci
          npm run build
          npm test
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Check generated assets match committed sources
        run: git diff --exit-code -- app/src/main/assets/editor
      - name: Test, lint and build APK
        run: ./gradlew :core:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Disha-FileKit-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-APK
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-reports
          path: |
            core/build/reports/
            app/build/reports/
            editor/test-results/
  android-13-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Disha-FileKit-debug-APK
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: Android-test-APK
          path: test-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-13-smoke-results
          path: smoke-results/
