<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Disha FileKit</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="brand">▤ <b>Disha FileKit</b><small data-i18n="offline"></small></div><button id="menuButton" aria-label="Menu">☰</button></header>
<main id="home">
  <div class="hero-icon">{ }</div><h1 data-i18n="welcome"></h1><p data-i18n="intro"></p>
  <button class="primary big" id="openHome" data-i18n="open"></button><button class="big" id="newHome" data-i18n="new"></button>
  <button id="recoverHome" class="big" data-i18n="recover"></button>
  <h2 data-i18n="recent"></h2><div id="recents"></div><p class="hint" data-i18n="formats"></p>
</main>
<section id="workspace" hidden>
  <div id="documentBar"><div><strong id="filename" dir="auto"></strong><small id="metadata"></small></div><span id="dirty" role="status"></span></div>
  <div id="tools"><button id="aiOpen">✦ AI</button><button id="selectRange">تحديد السطور / Lines</button><button id="undo" data-i18n="undo"></button><button id="redo" data-i18n="redo"></button><button id="wrap" data-i18n="wrap"></button><button id="smaller" dir="ltr" aria-label="Smaller font">A−</button><button id="larger" dir="ltr" aria-label="Larger font">A+</button></div>
  <div id="precision"><button id="left" aria-label="Left">←</button><button id="right" aria-label="Right">→</button><button id="up" aria-label="Up">↑</button><button id="down" aria-label="Down">↓</button><button id="indent">⇥</button><output dir="auto" id="position" aria-live="off"></output></div>
  <div id="editor" dir="ltr"></div>
  <nav id="actions"><button id="copy" data-i18n="copy"></button><button id="find" data-i18n="find"></button><button id="format" data-i18n="format"></button><button id="save" class="primary" data-i18n="save"></button><button id="saveAs" data-i18n="saveAs"></button></nav>
</section>
<section id="flowViewer" hidden>
  <h2 id="flowTitle"></h2><strong id="flowName" dir="auto"></strong>
  <p id="flowSelected" dir="ltr"></p><button id="flowBack"></button><div id="flowList" tabindex="-1"></div>
  <div id="flowDetailPanel"><nav id="flowTabs" aria-label="Flow sections"></nav>
  <input id="flowSearch" type="search" maxlength="512" dir="auto">
  <label><input id="flowHide" type="checkbox"><span id="flowHideLabel"></span></label>
  <p id="flowCount" role="status"></p><p id="flowNotes"></p><div id="flowRows"></div>
  <p id="flowWarning"></p><button id="flowExport"></button></div>
</section>
<div id="message" role="status" aria-live="polite"></div>
<dialog id="menu"><h2 data-i18n="options"></h2><button id="openMenu" data-i18n="open"></button><button id="newMenu" data-i18n="new"></button><button id="homeMenu" data-i18n="home"></button><button id="share" data-i18n="share"></button><button id="validate" data-i18n="validate"></button><button id="encoding" data-i18n="encoding"></button><button id="aiSettings">إعداد AI / AI settings</button><button id="theme" data-i18n="theme"></button><button id="language">English / عربي</button><button id="closeMenu" data-i18n="close"></button></dialog>
<dialog id="formatDialog"><h2 data-i18n="format"></h2><p data-i18n="formatWarning"></p><button id="indent2">2 spaces</button><button id="indent4">4 spaces</button><button id="minify" data-i18n="minify"></button><button id="closeFormat" data-i18n="cancel"></button></dialog>
<dialog id="rangeDialog"><h2>تحديد السطور / Select lines</h2><label for="rangeFrom">من / From</label><input id="rangeFrom" type="number" min="1" inputmode="numeric"><label for="rangeTo">إلى / To</label><input id="rangeTo" type="number" min="1" inputmode="numeric"><button id="rangeApply">تحديد / Select</button><button id="rangeClose">إغلاق / Close</button></dialog>
<dialog id="aiDialog"><h2>✦ Disha AI</h2><p id="aiScope"></p>
<label for="aiProvider">الخدمة / Provider</label><select id="aiProvider"><option value="ollama">Ollama — محلي / Local</option><option value="gemini">Gemini — سحابي مباشر / Direct cloud</option></select>
<button id="aiConfigure">إعداد واختبار AI / Set up &amp; test AI</button>
<label for="aiTranslateLanguage">لغة الترجمة / Translation language</label><select id="aiTranslateLanguage"><option value="Arabic">العربية / Arabic</option><option value="English">الإنجليزية / English</option></select><button id="aiTranslate">جهّز طلب الترجمة / Prepare translation request</button>
<label for="aiInstruction">طلبك / Your request</label><textarea id="aiInstruction" rows="3" maxlength="2000" placeholder="ترجم، اشرح، صحح، أو أعد كتابة التحديد / Translate, explain, fix or rewrite selection"></textarea><label class="cloud-option"><input id="aiCloud" type="checkbox">السماح بـ Gemini عند فشل المحلي لهذا الطلب / Allow cloud fallback for this request</label><button id="aiSend" class="primary">إرسال / Send</button><p id="aiStatus" role="status"></p><pre id="aiOutput" dir="auto" tabindex="0"></pre><button id="aiApply" disabled>استبدال النطاق بعد المراجعة / Replace range after review</button><button id="aiCopy">نسخ الإجابة / Copy response</button><button id="aiClose">إغلاق وإلغاء / Close &amp; cancel</button></dialog>
<footer>This project By Gogo &amp; Disha ®</footer>
<script src="editor.js"></script>
</body></html>
